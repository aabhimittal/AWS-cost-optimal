name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the suite
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the CLIs
        run: |
          python scripts/cost_impact_matrix.py --budget 10 --simulate --explain
          python scripts/cost_impact_matrix.py scripts/candidates.example.json --json
          python scripts/commitment_planner.py --demo --curve
          python scripts/rightsizing_advisor.py --demo --json
